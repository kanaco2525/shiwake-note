<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>SHIWAKE NOTE</title>
<style>
:root{
  /* 色：ネイビー基調。区分色は文字ラベルと併用する */
  --navy:#1f3a5f; --navy-d:#14284b; --navy-l:#e8eef6;
  --green:#176b3f; --green-bg:#e6f4ec;
  --gray:#4f5a68; --gray-bg:#eceef1;
  --orange:#a34f00; --orange-bg:#fff0de;
  --red:#a8211a; --red-bg:#fdecea;
  --text:#1c2430; --muted:#4f5a68; --line:#d5dbe3; --ctl:#66717f; --bg:#f5f7fa; --card:#fff; --focus:#1d4ed8;
  /* 文字サイズ（4段階）と余白（4・8・12・16・24） */
  --fs-title:20px; --fs-head:16px; --fs-body:16px; --fs-note:14px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.65;font-size:var(--fs-body)}
.skip{position:absolute;left:var(--sp2);top:-60px;background:#fff;color:var(--navy-d);padding:var(--sp2) var(--sp4);border:2px solid var(--navy);border-radius:6px;z-index:20;font-weight:700}
.skip:focus{top:var(--sp2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{background:var(--navy);color:#fff;padding:var(--sp3) var(--sp4)}
header.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:baseline;gap:var(--sp3);flex-wrap:wrap}
header.top h1{margin:0;font-size:var(--fs-title);letter-spacing:.08em}
header.top p{margin:0;font-size:var(--fs-note)}
main{max-width:1080px;margin:0 auto;padding:var(--sp4)}
main:focus{outline:none}
h2{margin:0 0 var(--sp2);font-size:var(--fs-title);line-height:1.4;color:var(--navy)}
h2:focus{outline:none}
h3{margin:var(--sp4) 0 var(--sp2);font-size:var(--fs-head);color:var(--navy)}
p{margin:0 0 var(--sp3)}
.note{font-size:var(--fs-note);color:var(--muted);margin:0 0 var(--sp3)}
.prog{margin:0 0 var(--sp2)}
.ex{display:block;font-size:var(--fs-note);color:var(--muted)}
.disc-inline{margin:var(--sp2) 0 0}
.intro{margin:0 0 var(--sp3);line-height:1.7}
.warn-t{font-size:var(--fs-note);color:var(--orange);margin-top:var(--sp1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:var(--sp4);margin-bottom:var(--sp4)}
/* 進行状況 */
nav.stp{margin-bottom:var(--sp4)}
ol.steps{list-style:none;display:flex;gap:var(--sp2);margin:0;padding:0}
ol.steps li{flex:1 1 0;min-width:0}
ol.steps button{width:100%;min-height:44px;border:1px solid var(--ctl);background:#fff;color:var(--navy-d);border-radius:6px;padding:var(--sp2);font:inherit;font-size:var(--fs-note);cursor:pointer;display:flex;gap:var(--sp2);align-items:center;justify-content:center}
ol.steps .n{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;border:1px solid currentColor;font-weight:700}
ol.steps button[disabled]{color:var(--muted);background:#e9ecf0;border-color:var(--line);cursor:not-allowed}
ol.steps li.done button{border-color:var(--navy);color:var(--navy)}
ol.steps li.cur button{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.step-cur{display:none;margin:var(--sp2) 0 0;font-weight:700;color:var(--navy)}
/* フォーム・ボタン */
label{display:block;font-weight:700;margin:var(--sp3) 0 var(--sp1)}
.req{color:var(--red);font-size:var(--fs-note);margin-left:var(--sp2)}
textarea{width:100%;min-height:84px;font:inherit;padding:var(--sp2) var(--sp3);border:1px solid var(--ctl);border-radius:6px;resize:vertical}
select{min-height:44px;font:inherit;padding:var(--sp1) var(--sp2);border:1px solid var(--ctl);border-radius:6px;background:#fff;color:var(--text)}
textarea:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{min-height:44px;padding:var(--sp2) var(--sp4);border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sub{background:#fff;color:var(--navy)}
.btn[disabled]{background:#dfe3e9;border-color:#c3cad4;color:#4f5a68;cursor:not-allowed}
.row{display:flex;gap:var(--sp3);flex-wrap:wrap;align-items:center;margin-top:var(--sp3)}
.msg{padding:var(--sp3);border-radius:6px;margin:var(--sp3) 0;font-size:var(--fs-note);border:1px solid}
.msg.err{background:var(--red-bg);border-color:#e6a8a3;color:var(--red)}
.msg.warn{background:var(--orange-bg);border-color:#efc48f;color:#7a3d00}
.msg.ok{background:var(--green-bg);border-color:#a8d5bb;color:#0f5a33}
.msg.info{background:var(--navy-l);border-color:#b8c8de;color:var(--navy-d)}
.msg:focus{outline:none}
/* 件数カード */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp3);margin:var(--sp2) 0 var(--sp3)}
.stat{border:1px solid var(--line);border-radius:8px;padding:var(--sp3);background:#fff}
.stat b{display:block;font-size:var(--fs-title);line-height:1.3}
.stat span{font-size:var(--fs-note);color:var(--muted)}
.stat.biz{border-left:6px solid var(--green)}.stat.priv{border-left:6px solid var(--gray)}.stat.chk{border-left:6px solid var(--orange)}.stat.un{border-left:6px solid var(--navy)}
.badge{display:inline-block;padding:0 var(--sp3);border-radius:12px;font-size:var(--fs-note);font-weight:700;white-space:nowrap}
.badge.biz{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.badge.priv{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray)}
.badge.chk{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange)}
.badge.fin{background:var(--navy);color:#fff;border:1px solid var(--navy)}
.badge.none{background:#fff;color:var(--muted);border:1px dashed var(--muted)}
.tag{display:inline-block;font-size:var(--fs-note);border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 var(--sp1);margin-left:var(--sp1)}
/* 絞り込み */
.chips{display:flex;gap:var(--sp2);flex-wrap:wrap;margin:var(--sp2) 0}
.chip{min-height:44px;padding:var(--sp1) var(--sp3);border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:22px;font:inherit;font-size:var(--fs-note);font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
/* 表（画面③） */
table{width:100%;border-collapse:collapse;font-size:var(--fs-note)}
th,td{border-bottom:1px solid var(--line);padding:var(--sp2) var(--sp1);text-align:left;vertical-align:top}
th{background:var(--navy-l);color:var(--navy-d)}
td.num,th.num{text-align:right;white-space:nowrap}
td.desc{font-size:var(--fs-body);word-break:break-word}
.sum{font-size:var(--fs-note)}
details.det{margin-top:var(--sp1)}
details.det summary{cursor:pointer;color:var(--navy);font-weight:700;font-size:var(--fs-note);min-height:24px;padding:var(--sp1) 0}
details.det .full{margin:var(--sp1) 0 0;padding:var(--sp2) var(--sp3);background:var(--navy-l);border-radius:6px;font-size:var(--fs-note);color:var(--text)}
/* 画面④のカード */
.item{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:var(--sp3);margin-bottom:var(--sp3);background:#fff}
.item.biz{border-left-color:var(--green)}.item.priv{border-left-color:var(--gray)}.item.chk{border-left-color:var(--orange)}
.item .r1{display:flex;gap:var(--sp2) var(--sp4);flex-wrap:wrap;align-items:center}
.item .r2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--sp2) var(--sp4);align-items:center;margin-top:var(--sp2)}
.item .r2 .t{font-size:var(--fs-body);overflow-wrap:anywhere}
.item .r2 .choice{margin-top:0;flex-wrap:nowrap}
.item .r4{display:flex;gap:var(--sp2) var(--sp3);flex-wrap:wrap;align-items:center;margin-top:var(--sp3)}
.item .r4 button.plain{min-height:44px;min-width:96px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;font:inherit;padding:0 var(--sp3);cursor:pointer}
.item .t{font-weight:700;word-break:break-word}
.item .reason{font-size:var(--fs-note);margin:var(--sp2) 0 0}
.item.compact{padding:var(--sp2) var(--sp3);display:flex;gap:var(--sp2) var(--sp3);flex-wrap:wrap;align-items:center}
.item.compact .t{flex:1 1 220px;font-weight:400}
.choice{display:flex;gap:var(--sp2);margin-top:var(--sp3);flex-wrap:wrap;align-items:center}
.choice button,.chg{min-height:44px;min-width:96px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;font:inherit;font-weight:700;cursor:pointer;padding:0 var(--sp3)}
.choice button[aria-pressed="true"]{background:var(--navy);color:#fff}
.choice .plain{border-width:1px;font-weight:400}
.bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:var(--sp2) var(--sp3);margin-bottom:var(--sp3);display:flex;gap:var(--sp2) var(--sp3);flex-wrap:wrap;align-items:center}
.bar .un{font-weight:700;color:var(--orange)}
.bar .un.zero{color:var(--green)}
.bar progress{width:140px;height:12px;accent-color:var(--navy)}
.bar .sp{flex:1 1 0}
.msg p{margin:0 0 var(--sp2)}
.cmp{display:flex;flex-wrap:wrap;gap:var(--sp2) var(--sp3);align-items:center;margin-top:var(--sp3);padding:var(--sp2) var(--sp3);background:var(--navy-l);border:1px solid #b8c8de;border-radius:6px;color:var(--navy-d)}
.cmp-c{display:flex;flex-direction:column;gap:var(--sp1);align-items:flex-start}
.cmp-l{font-size:var(--fs-note);color:var(--muted)}
.cmp-a{font-size:var(--fs-title);font-weight:700;color:var(--navy)}
.cmp-n{flex:1 1 100%;margin:0;font-size:var(--fs-note)}
.item.compact .cmp{flex:1 1 100%;margin-top:0}
.item .msg{margin:var(--sp2) 0 0}
.dupmark{color:var(--red);font-weight:700}
.dupmark-done{color:var(--navy);font-weight:700}
.dupbtns{display:flex;flex-wrap:wrap;gap:var(--sp1)}
.dupbtn{min-height:44px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;font:inherit;font-size:var(--fs-note);padding:0 var(--sp3);cursor:pointer}
.dupbtn[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:700}
.gnav{margin:0 0 var(--sp2);scroll-margin-top:96px}
.gnav-row{display:flex;flex-wrap:wrap;gap:var(--sp2);align-items:center}
.gnav-row select{max-width:100%;min-width:0;flex:1 1 220px}
.gnav-info{margin:var(--sp1) 0 0;font-size:var(--fs-note);color:var(--navy-d)}
details.bulk.gsec{border-width:1px;margin-bottom:var(--sp1)}
.undo-one{margin-bottom:var(--sp2)}
.grp-list{display:flex;flex-direction:column;gap:var(--sp2);margin:var(--sp2) 0}
.grp-row{border:1px solid var(--line);border-radius:6px;padding:var(--sp2) var(--sp3)}
.grp-meta{display:flex;flex-wrap:wrap;gap:var(--sp1) var(--sp3);align-items:center;font-size:var(--fs-note);margin:var(--sp1) 0 var(--sp1) 28px}
.dupnote{flex:1 1 100%;color:var(--muted)}
.dupline{margin:var(--sp2) 0 0;font-size:var(--fs-note);display:flex;flex-wrap:wrap;gap:var(--sp1) var(--sp3);align-items:center}
.item.compact .dupline{flex:1 1 100%;margin:0}
.jump{min-height:44px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;font:inherit;font-size:var(--fs-note);padding:0 var(--sp3);cursor:pointer}
details.bulk{background:var(--navy-l);border:2px solid var(--navy);border-radius:8px;padding:0;margin-bottom:var(--sp3);color:var(--navy-d)}
details.bulk summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:var(--sp3);padding:var(--sp2) var(--sp3);font-weight:700;color:var(--navy);list-style:none}
details.bulk summary::-webkit-details-marker{display:none}
details.bulk summary .bt{flex:none}
details.bulk summary .bs2{flex:1 1 200px;font-weight:400;font-size:var(--fs-note);color:var(--navy-d)}
details.bulk summary::after{content:'';flex:none;width:10px;height:10px;margin:0 var(--sp1) 4px auto;border-right:3px solid var(--navy);border-bottom:3px solid var(--navy);transform:rotate(45deg)}
details.bulk[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
details.bulk[open] summary{border-bottom:1px solid #b8c8de}
details.bulk .bulk-body{padding:var(--sp2) var(--sp3) var(--sp3)}
.bulk-act{margin-top:var(--sp2)}
dialog.bulk-dlg{width:min(720px,calc(100vw - 24px));max-width:none;max-height:calc(100vh - 24px);overflow:auto;padding:var(--sp4);border:2px solid var(--navy);border-radius:8px;background:#fff;color:var(--text)}
dialog.bulk-dlg::backdrop{background:rgba(20,40,75,.5)}
dialog.bulk-dlg h3{margin-top:0;word-break:break-word}
.bulk-list{overflow:auto;max-height:40vh;min-height:96px;border:1px solid var(--ctl);border-radius:6px;padding:0 var(--sp3);margin:var(--sp2) 0}
.bulk-row{border-bottom:1px solid var(--line);padding:var(--sp2) 0}
.bulk-row:last-child{border-bottom:none}
.bulk-row .bt{font-weight:700;word-break:break-word}
.bulk-row .bs{font-size:var(--fs-note)}
.chkrow{display:flex;gap:var(--sp3);align-items:center;font-weight:700;min-height:44px;margin:var(--sp2) 0 0}
.chkrow input{width:24px;height:24px;flex:none}
fieldset.interp{border:1px solid var(--ctl);border-radius:8px;margin:var(--sp3) 0;padding:var(--sp2) var(--sp3)}
fieldset.interp legend{font-weight:700;color:var(--navy);padding:0 var(--sp1)}
label.opt{display:flex;gap:var(--sp3);align-items:center;min-height:44px;margin:var(--sp1) 0;font-weight:400;cursor:pointer}
label.opt input{width:24px;height:24px;flex:none}
.pend{border:2px solid var(--navy);border-radius:8px;padding:var(--sp4);margin:var(--sp3) 0;background:#fff}
.pend h3{margin-top:0;word-break:break-word}
.pend h3:focus{outline:none}
.pv-i{border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:8px;padding:var(--sp2) var(--sp3);margin-bottom:var(--sp2)}
.pv-t{word-break:break-word}
.pv-n{font-size:var(--fs-note);color:var(--muted)}
.pv-a{font-size:var(--fs-note);margin-top:var(--sp1);word-break:break-word}
.itag{display:inline-block;font-weight:700;border:1px solid var(--navy);color:var(--navy);padding:0 var(--sp2);border-radius:4px}
.itag.in,.itag.refund{border-color:var(--green);color:var(--green)}
.itag.zero,.itag.unread{border-color:var(--orange);color:var(--orange)}
.cnt{font-weight:700;word-break:break-word}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:var(--sp1) var(--sp4);margin:var(--sp2) 0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-weight:700}
.ok-t{color:var(--green)}.ng-t{color:var(--red)}
ul.sm{margin:var(--sp1) 0 0;padding-left:20px;font-size:var(--fs-note)}
details.fold summary{cursor:pointer;color:var(--navy);font-weight:700;font-size:var(--fs-note);padding:var(--sp1) 0}
footer{max-width:1080px;margin:0 auto;padding:var(--sp2) var(--sp4) var(--sp5);font-size:var(--fs-note);color:var(--muted)}
footer .disc{border:1px solid var(--line);background:#fff;border-radius:6px;padding:var(--sp2) var(--sp3)}
@media (max-width:720px){
  main{padding:var(--sp3)}
  ol.steps .lbl{display:none}
  ol.steps button{padding:var(--sp1)}
  .step-cur{display:block}
  table.res thead{display:none}
  table.res,table.res tbody,table.res tr,table.res td{display:block;width:100%}
  table.res tr{border:1px solid var(--line);border-radius:8px;margin-bottom:var(--sp3);padding:var(--sp2) var(--sp3);background:#fff}
  table.res td{border:none;padding:var(--sp1) 0;text-align:left}
  table.res td.num{text-align:left}
  table.res td::before{content:attr(data-l) "：";color:var(--muted);font-size:var(--fs-note)}
  details.det summary,details.fold summary{display:flex;align-items:center;min-height:44px}
  .bar progress{width:100%}
  .item .r2{grid-template-columns:1fr}
  details.bulk summary{flex-wrap:wrap}
  details.bulk summary .bt{flex:1 1 0}
  details.bulk summary .bs2{flex:1 1 100%;order:3}
  details.bulk summary::after{margin-left:0}
  .item .r2 .choice button{flex:1 1 0}
  dl.kv{grid-template-columns:1fr}
}
</style>

<header class="top"><div class="in"><h1>SHIWAKE NOTE</h1><p>仕事・副業のカード・銀行明細を整理するツール（処理はこのブラウザ内だけで行います）</p></div></header>
<main id="app" tabindex="-1"></main>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<footer id="foot"></footer>

<script>
'use strict';
/* =====================================================================
   SHIWAKE NOTE — 単一HTML / 外部通信なし / 永続保存なし
   ===================================================================== */

// ==CORE-START== （DOMに依存しない処理。テスト用に分離）
const DISCLAIMER_TEXT = '本ツールは明細の整理を補助するものです。経費への算入可否の判断は行いません。最終的な判断はご自身または税理士・税務署等にご確認ください。'; // コンペ指定の免責文（一字一句変更しない）
const OUT_HEADERS = ['日付','摘要','金額','ツール仕分け','最終区分','理由'];
const CAT = { BIZ:'事業候補', PRIV:'私用候補', CHK:'要判断' };
// 初版の暫定しきい値（調整しやすいよう定数化）
const TH = { BIZ_MIN:5, BIZ_PRIV_MAX:2, PRIV_MIN:4, PRIV_BIZ_MAX:2, W_BIZ:3, W_PRIV:4, W_PROFILE:2 };

const nfkc = s => String(s == null ? '' : s).normalize('NFKC');
const pad2 = n => String(n).padStart(2, '0');
const fmtYen = n => (n == null ? '' : n.toLocaleString('ja-JP'));
// 画面表示専用の金額表記（入金・出金・返金を文字で示す）。元の表記（amountRaw）・内部の符号・方向・CSV出力は変えない
function amountDisp(r){
  if (r.amountSigned == null) return '金額不明';
  const v = fmtYen(Math.abs(r.amountSigned)) + '円';
  if (r.kind === 'refund') return '返金 ' + v;
  if (r.direction === 'in') return '入金 ' + v;
  if (r.direction === 'out') return '出金 ' + v;
  return '方向不明 ' + v;
}

/* ---- 文字コード ---- */
function decodeBytes(buf){
  let b = new Uint8Array(buf);
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) b = b.subarray(3);
  try { return new TextDecoder('utf-8', { fatal:true }).decode(b); }
  catch (e) { throw new Error('UTF-8として読み取れませんでした（UTF-8 / UTF-8 BOM付きのCSVに対応しています）。Shift_JIS など別の文字コードのCSVは読み込めません。Excelなどで「CSV UTF-8（コンマ区切り）」として保存し直してから、もう一度読み込んでください。'); }
}

/* ---- RFC4180 パーサ ---- */
const CSV_FIX = '誤った明細の結合や、金額・摘要の改変を避けるため、読み込みを中止しました。CSVを修正して、もう一度読み込んでください（項目の中にカンマや改行がある場合は、その項目を引用符（"）で囲みます）。';
function parseCsv(text){   // RFC 4180。構造の異常（引用符の不整合）は、推測で読み進めず、行番号つきのエラーにする。rows.lines[i]＝i行目の行が、ファイルの何行目から始まるか
  const rows = [], lines = []; let row = [], f = '', q = false, i = 0, line = 1, rowLine = 1, afterQ = false, fieldStart = true, qLine = 0; const n = text.length;
  while (i < n) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i += 2; continue; } q = false; afterQ = true; i++; continue; }
      if (c === '\r' && text[i+1] === '\n') { f += '\r\n'; line++; i += 2; continue; }
      if (c === '\r' || c === '\n') line++;
      f += c; i++; continue;
    }
    if (c === '"') {
      if (fieldStart) { q = true; qLine = line; fieldStart = false; i++; continue; }
      throw new Error(afterQ ? line + '行目：引用符（"）で囲まれた項目の直後に、さらに引用符があります（この項目は、' + qLine + '行目の引用符から始まっています）。' + CSV_FIX : line + '行目：引用符で囲まれていない項目の途中に、引用符（"）があります。' + CSV_FIX);
    }
    if (c === ',') { row.push(f); f = ''; fieldStart = true; afterQ = false; i++; continue; }
    if (c === '\r' || c === '\n') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); lines.push(rowLine); row = []; f = ''; fieldStart = true; afterQ = false; i++; line++; rowLine = line; continue; }
    if (afterQ) throw new Error(line + '行目：引用符（"）で囲まれた項目の直後に、カンマ・改行以外の文字があります（この項目は、' + qLine + '行目の引用符から始まっています。引用符が閉じる位置が、ずれている可能性があります）。' + CSV_FIX);
    f += c; fieldStart = false; i++;
  }
  if (q) throw new Error(qLine + '行目の引用符（"）が、ファイルの最後まで閉じられていません（引用符の閉じ忘れで、後ろの明細が結合されている可能性があります）。' + CSV_FIX);
  if (f !== '' || row.length || afterQ) { row.push(f); rows.push(row); lines.push(rowLine); }
  rows.lines = lines;
  return rows;
}

/* ---- 列名の吸収 ---- */
const normHeader = h => nfkc(h).replace(/[\s　]/g, '').toLowerCase();
const ALIAS = {
  date:   ['利用日','ご利用日','取引日','日付','年月日','取引年月日'],
  desc:   ['利用店名','ご利用店名','利用先','ご利用先','店名','摘要','内容','取引内容'],
  amount: ['利用金額','ご利用金額','金額','支払金額','請求金額'],
  out:    ['出金額','出金','お支払金額','お引出し','引出額'],
  inn:    ['入金額','入金','お預入れ','お預入額','預入額'],
  inst:   ['支払回数','回数','支払区分'],
  note:   ['備考','メモ','摘要2'],
  bal:    ['残高','差引残高'],
  dirLoose: ['区分','種別','取引種別','種類'],   // 入出金区分かどうかを、値の内容で判断する候補列
  dirc:   ['入出金区分','入出金','出入金区分','出入金','入払区分','取引区分','収支区分','収支','入出区分']   // 金額が1列の形式で、入金・出金を示す列
};
function detectColumns(headerRow){
  const hs = headerRow.map(normHeader); const idx = {};
  for (const k of Object.keys(ALIAS)) {
    const al = ALIAS[k].map(normHeader);
    const p = hs.findIndex(h => al.includes(h));
    idx[k] = p;
  }
  let format = null, variant = '';
  if (idx.out >= 0 && idx.inn >= 0) format = 'B';
  else if (idx.amount >= 0 && idx.dirc >= 0) { format = 'B'; variant = '金額＋入出金区分の列'; }   // 入金・出金を区分列で明確に判定できる形式
  else if (idx.amount >= 0) format = 'A';
  if (!format || idx.date < 0 || idx.desc < 0) {
    throw new Error('対応している列の組み合わせを判別できません。必要な列：日付（利用日・取引日など）、店名または摘要、金額（または出金額と入金額）。検出した列名：' + (headerRow.map(h => '「' + h + '」').join('') || '（なし）'));
  }
  return { format, idx, variant };
}

/* ---- 日付・金額 ---- */
function parseDate(raw){
  const s = nfkc(raw).trim(); let m = s.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/);
  if (!m) { m = s.match(/^(\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/); if (m) m[1] = String(2000 + Number(m[1])); }
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3]; const dt = new Date(Date.UTC(y, mo-1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo-1 || dt.getUTCDate() !== d) return null;
  return y + '-' + pad2(mo) + '-' + pad2(d);
}
function parseAmount(raw){   // 正しい表記（桁区切りは3桁ごと、符号、¥・円）だけを数値にする。1,50 のような不正な桁区切り・数字の間の空白・安全な整数を超える値は、補正せず「読み取れない」とする
  let s = nfkc(raw).trim(); if (s === '') return { empty:true };
  s = s.replace(/[¥円]/g, '').trim(); let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1).trim(); }
  if (/^\+/.test(s)) { if (neg) return { bad:true }; s = s.slice(1).trim(); }   // 先頭の「+」は、正の数。括弧との併用・符号の重複（+-5 など）は、読み取れない。「+」だけで、入金・出金は判断しない（向きは、形式の解釈で決める）
  else if (/^[-−‐‑–—▲△]/.test(s)) { neg = true; s = s.slice(1).trim(); }
  if (/\s/.test(s)) return { bad:true };
  if (s.includes(',')) { if (!/^\d{1,3}(,\d{3})+$/.test(s)) return { bad:true }; s = s.replace(/,/g, ''); }
  if (!/^\d+$/.test(s)) return { bad:true };
  const v = parseInt(s, 10); if (!Number.isSafeInteger(v)) return { bad:true };
  return { value:v, neg };
}
function parseInstallments(raw){   // 意味が明確な表記だけを読む。一括・一括払い・1回・1回払い→1、N回・N回払い・分割N回・N分割・N→N。0回、リボ、ボーナス払いなど、回数を確定できない表記は null（読み取れない→要判断）
  const s = nfkc(raw).replace(/\s+/g, ''); if (s === '') return null;
  if (/^(一括払い?|一括)$/.test(s)) return 1;
  const m = s.match(/^(?:分割(\d+)(?:回払い?|回)?|(\d+)(?:回払い?|回|分割)?)$/);
  if (!m) return null;
  const n = parseInt(m[1] || m[2], 10); return n >= 1 ? n : null;
}
const normDesc = s => nfkc(s).toLowerCase().replace(/[\s　]/g, '');
const REFUND_RE = /返金|ヘンキン|取消|キャンセル/;
const inKind = d => REFUND_RE.test(d) ? 'refund' : (/利息|リソク/.test(d) ? 'interest' : 'income');
// 入出金区分の値：明確に読み取れるものだけを受け付ける（それ以外は読み込みを中止する）
const DIR_OUT = ['出金','支出','引出','引出し','引き出し','払出','払出し','支払','支払い','お支払','お支払い','ご利用','利用','購入','デビット','debit','出'];
const DIR_IN  = ['入金','収入','預入','預入れ','お預入','お預入れ','返金','払戻','払戻し','クレジット','credit','入'];
function dirOf(v){ const s = normDesc(v); if (DIR_OUT.includes(s)) return 'out'; if (DIR_IN.includes(s)) return 'in'; return null; }

/* ---- 形式の事前判定：金額が1列で、入出金の向きを列名から判断できないCSVは、利用者の選択が必要 ---- */
const INTERP = {   // 選択肢（初期状態は未選択）。conv：残高の増減との照合に使う向き（+1＝プラスが入金／-1＝プラスが出金）
  card:    { label: 'カード明細（マイナス＝返金）',  conv: -1 },
  bankNeg: { label: '銀行明細（マイナス＝出金）',    conv: 1 },
  bankPos: { label: '銀行明細（プラス＝出金）',      conv: -1 }
};
const INTERP_KEYS = ['card', 'bankNeg', 'bankPos'];
const CARD_HEADERS = ['利用日','ご利用日','利用店名','ご利用店名','利用先','ご利用先','店名','利用金額','ご利用金額'].map(normHeader);
const BAL_MIN_ROWS = 4;   // 残高との照合に必要な最小行数
function analyzeBalance(rows, idx){   // 残高の増減が、金額の向きと整合するかを調べる（判定できないときはブロックしない）
  if (idx.bal < 0) return { state: 'none', reason: '' };
  const am = [], bl = []; let unread = 0;
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; if (r.every(c => String(c).trim() === '')) continue;
    const a = parseAmount(idx.amount < r.length ? r[idx.amount] : ''), b = parseAmount(idx.bal < r.length ? r[idx.bal] : '');
    if (a.empty || a.bad || b.empty || b.bad) { unread++; continue; }
    am.push(a.neg ? -a.value : a.value); bl.push(b.neg ? -b.value : b.value);
  }
  if (unread) return { state: 'unknown', reason: '金額または残高を読み取れない行が' + unread + '件あるため、照合できません', rows: am.length };
  if (am.length < BAL_MIN_ROWS) return { state: 'unknown', reason: '明細が' + BAL_MIN_ROWS + '行未満のため、照合できません', rows: am.length };
  const hit = new Set();
  for (const order of ['asc', 'desc']) for (const c of [1, -1]) {   // asc：古い順／desc：新しい順
    let ok = true;
    for (let i = 1; i < am.length && ok; i++) {
      const d = order === 'asc' ? bl[i] - bl[i - 1] : bl[i - 1] - bl[i], a = order === 'asc' ? am[i] : am[i - 1];
      if (d !== c * a) ok = false;
    }
    if (ok) hit.add(c);
  }
  if (hit.size === 1) return { state: 'unique', c: [...hit][0], rows: am.length };
  if (hit.size === 0) return { state: 'unknown', reason: '残高の増減が、金額と連続して合わないため、照合できません', rows: am.length };
  return { state: 'unknown', reason: '金額が同額などで、どちらの向きにも合うため、照合できません', rows: am.length };
}
// 選択肢ごとの照合結果。block：読み込み確定を無効にする（別の向きだけが全行で整合し、選択と明確に矛盾するときに限る）
function balanceVerdict(bal, key, mixed){
  if (!bal || bal.state === 'none') return { status: 'none', text: '', block: false };
  if (bal.state === 'unknown') return { status: 'unknown', text: '判定できません（' + bal.reason + '）', block: false };
  if (INTERP[key].conv === bal.c) return { status: 'match', text: '一致', block: false };
  const other = INTERP_KEYS.filter(k => INTERP[k].conv === bal.c).map(k => INTERP[k].label).join('または');
  return { status: 'mismatch', text: '不一致（残高の増減は、' + other + 'の向きと一致します）', block: !mixed };
}

/* ---- 明細の読み込み（元データを全件保持）---- */
function prepareStatement(text, fileName){   // 形式の判定まで。選択が必要な場合は needsChoice を返し、まだ明細を作らない
  const rows = parseCsv(text);
  if (!rows.length) throw new Error('ファイルが空です。明細の行を含むCSVを選んでください。');
  let { format, idx, variant } = detectColumns(rows[0]);
  const width = rows[0].length, ragged = [];   // 列数が見出しと異なる行：明細の列の対応を確定できないため、補完も無視もせず、読み込みを中止する
  let dataRows = 0;
  for (let i = 1; i < rows.length; i++) { const r = rows[i]; if (r.every(c => String(c).trim() === '')) continue; dataRows++; if (r.length !== width) ragged.push({ ln: rows.lines[i], n: r.length }); }
  if (ragged.length) throw new Error('列数が見出し（' + width + '列）と異なる行が' + ragged.length + '行あります（' + ragged.slice(0, 3).map(x => x.ln + '行目：' + x.n + '列').join('、') + (ragged.length > 3 ? ' ほか' : '') + '）。列の対応を確定できないため、列を補ったり無視したりせず、読み込みを中止しました。金額の桁区切り（1,000 など）が引用符で囲まれていない、列が足りない・余分にあるなどの可能性があります。CSVを修正して、もう一度読み込んでください。');
  if (!dataRows) throw new Error('読み込める明細がありません（見出しの行だけ、または空行だけのCSVです）。明細の行を含むCSVを選んでください。');
  if (format === 'A' && idx.dirLoose >= 0) {   // 「区分」「種別」の列：値がすべて入金・出金と読めるときだけ入出金区分として扱う。まったく読めなければ無視し、一部だけ読める場合は誤読を避けて中止する
    let mapped = 0, other = 0;
    for (let i = 1; i < rows.length; i++) { const r = rows[i]; if (r.every(c => String(c).trim() === '')) continue; const v = String(idx.dirLoose < r.length ? r[idx.dirLoose] : '').trim(); if (v === '') continue; if (dirOf(v)) mapped++; else other++; }
    if (mapped > 0 && other === 0) { format = 'B'; variant = '金額＋入出金区分の列'; idx.dirc = idx.dirLoose; }
    else if (mapped > 0 && other > 0) throw new Error('「' + rows[0][idx.dirLoose] + '」列に、入金・出金と読める値と、そうでない値が混在しています。誤った仕分けを避けるため、読み込みを中止しました。出金額／入金額の列がある形式、または「入金」「出金」で統一された区分の列があるCSVを使用してください。');
  }
  const cell = (r, k) => (idx[k] >= 0 && idx[k] < r.length ? r[idx[k]] : '');
  if (variant) {   // 入出金区分の列：判定できない値が1行でもあれば、誤った仕分けを続けずに中止する
    const bad = [];
    for (let i = 1; i < rows.length; i++) { const r = rows[i]; if (r.every(c => String(c).trim() === '')) continue; if (!dirOf(cell(r, 'dirc'))) bad.push((i + 1) + '行目：' + (String(cell(r, 'dirc')).trim() === '' ? '（空欄）' : '「' + String(cell(r, 'dirc')).trim().slice(0, 20) + '」')); }
    if (bad.length) throw new Error('「' + rows[0][idx.dirc] + '」列の値から、入金・出金を判定できない行が' + bad.length + '件あります（' + bad.slice(0, 3).join('、') + (bad.length > 3 ? ' ほか' : '') + '）。誤った仕分けを避けるため、読み込みを中止しました。出金額／入金額の列がある形式、または「入金」「出金」と読める区分の列があるCSVを使用してください。');
  }
  let choice = null;
  if (format === 'A' && !variant) {   // 金額が1列で、入出金区分の列がない：カード専用の列名があり、残高がなければ、従来どおりカード形式。それ以外は利用者が選ぶ
    const card = rows[0].map(normHeader).some(x => CARD_HEADERS.includes(x)) || idx.inst >= 0, hasBal = idx.bal >= 0;
    if (!card || hasBal) {
      let readable = 0;
      for (let i = 1; i < rows.length; i++) { const r = rows[i]; if (r.every(c => String(c).trim() === '')) continue; const a = parseAmount(cell(r, 'amount')); if (!a.empty && !a.bad) readable++; }
      if (!readable) throw new Error('金額の列「' + rows[0][idx.amount] + '」に、読み取れる金額が1件もありません。金額が数字（カンマ・円記号・マイナス記号は可）で入力されているか確認してください。');
      const amtName = '「' + rows[0][idx.amount] + '」';
      choice = { mixed: card && hasBal, hasBal, balance: analyzeBalance(rows, idx),
        why: card && hasBal ? 'カード明細に使われる列名と「' + rows[0][idx.bal] + '」の列が両方あり、金額の列' + amtName + 'のマイナスが返金か出金かを、列名だけでは判断できません。'
          : hasBal ? '「' + rows[0][idx.bal] + '」の列があり、銀行の明細の可能性がありますが、金額の列' + amtName + 'のマイナスが出金か返金かを、列名だけでは判断できません。'
          : '列名から、カードの明細か銀行の明細かを判断できません。金額の列' + amtName + 'のマイナスが返金か出金かが、決まらない状態です。' };
    }
  }
  return { rows, format, idx, variant, fileName, choice, needsChoice: !!choice };
}
function buildStatement(prep, interp){   // 解釈（選択肢）を指定して、明細を作る。選択が不要な形式では、interp は無視する
  const { rows, idx, variant, fileName } = prep; let format = prep.format;
  let mode = null;
  if (prep.needsChoice) { if (!INTERP[interp]) throw new Error('形式が選択されていません。'); mode = interp; if (mode !== 'card') format = 'B'; }
  const records = []; let blank = 0; const cell = (r, k) => (idx[k] >= 0 && idx[k] < r.length ? r[idx[k]] : '');
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (r.every(c => String(c).trim() === '')) { blank++; continue; }
    const rec = { id: records.length + 1, source: format, rowNo: i + 1, raw: r.slice(), warnings: [],
      dateRaw: cell(r,'date'), desc: cell(r,'desc'), noteRaw: cell(r,'note'),
      date: null, descNorm: normDesc(cell(r,'desc')), amountSigned: null, direction: 'unknown', kind: 'unknown',
      amountRaw: '', instColumn: true, installments: null, dup: 0, dupGroup: 0, dupStatus: '', lastEdit: 0, toolCategory: null, reason: '', csvReason: '', finalCategory: null, reclassFrom: null, refund: null };
    if (r.length !== rows[0].length) rec.warnings.push('列数がヘッダーと異なります（' + r.length + '列）。読み取れた範囲で保持しました。');
    rec.date = parseDate(rec.dateRaw);
    if (!rec.date) rec.warnings.push('日付を読み取れません（原文のまま保持）。');
    if (format === 'A') {
      rec.amountRaw = cell(r,'amount'); rec.amountCol = idx.amount;   // 出力CSVには、元の表記をそのまま使う（数値の解析は内部の判定用）。amountCol：元の行（rec.raw）の、金額の列（出力後の照合の比較元）
      const a = parseAmount(rec.amountRaw);
      if (a.empty || a.bad) rec.warnings.push('金額を読み取れません。');
      else { rec.amountSigned = a.neg ? -a.value : a.value; rec.direction = rec.amountSigned < 0 ? 'in' : 'out'; }
      rec.instColumn = idx.inst >= 0;   // 支払回数の列が無いCSVでは、分割払いの判定を行わない
      if (rec.instColumn) { rec.installments = parseInstallments(cell(r,'inst')); if (rec.installments == null) rec.warnings.push('支払回数を読み取れません。'); }
      rec.kind = rec.direction === 'in' ? 'refund' : (rec.direction === 'out' ? 'purchase' : 'unknown');
    } else if (mode) {   // 銀行明細として選択された、金額が1列のCSV（支払回数による分割払いの判定は行わない）
      rec.amountRaw = cell(r,'amount'); rec.amountCol = idx.amount; rec.instColumn = false;
      const a = parseAmount(rec.amountRaw);
      if (a.empty || a.bad) rec.warnings.push('金額を読み取れません。');
      else {
        const isOut = a.value === 0 ? true : (mode === 'bankNeg' ? a.neg : !a.neg);
        if (a.value === 0) rec.warnings.push('金額が0です。出金として扱いました。');
        rec.direction = isOut ? 'out' : 'in'; rec.amountSigned = isOut ? a.value : -a.value; rec.kind = isOut ? 'purchase' : inKind(rec.descNorm);
      }
    } else if (variant) {
      rec.amountRaw = cell(r,'amount'); rec.amountCol = idx.amount;
      const a = parseAmount(rec.amountRaw), d = dirOf(cell(r,'dirc'));
      if (a.empty || a.bad) rec.warnings.push('金額を読み取れません。');
      else {
        if (a.neg) rec.warnings.push('金額がマイナスですが、入出金区分の列を優先して読み込みました。');
        rec.direction = d; rec.amountSigned = d === 'in' ? -a.value : a.value; rec.kind = d === 'in' ? inKind(rec.descNorm) : 'purchase';
      }
    } else {
      const oRaw = cell(r,'out'), nRaw = cell(r,'inn'); rec.amountRaw = String(oRaw).trim() !== '' ? oRaw : nRaw; rec.amountCol = String(oRaw).trim() !== '' ? idx.out : idx.inn;   // 出力CSVには、入金額も元の値のまま使う
      const o = parseAmount(oRaw), n = parseAmount(nRaw);
      const oOk = !o.empty && !o.bad && !o.neg, nOk = !n.empty && !n.bad && !n.neg;
      if ((o.bad || n.bad) || (o.neg || n.neg)) rec.warnings.push('出金額または入金額を読み取れません。');
      else if (oOk && nOk) rec.warnings.push('出金額と入金額の両方に値があり、取引方向を決められません。');
      else if (!oOk && !nOk) rec.warnings.push('出金額・入金額のどちらにも値がありません。');
      else if (oOk) { rec.amountSigned = o.value; rec.direction = 'out'; rec.kind = 'purchase'; }
      else { rec.amountSigned = -n.value; rec.direction = 'in'; rec.kind = inKind(rec.descNorm); }
    }
    records.push(rec);
  }
  markDuplicates(records);
  return { format, records, stats: { fileName, totalRows: rows.length - 1, read: records.length, blank, variant, chosen: mode } };
}
function parseStatement(text, fileName, interp){   // 形式が明確なCSVは、従来どおり1段階で読み込む。選択が必要なCSVは interp（INTERP のキー）が無いと、読み込まない
  const prep = prepareStatement(text, fileName);
  if (prep.needsChoice && !interp) { const e = new Error('このCSVは、形式（カード明細／銀行明細）を選択する必要があります。'); e.needChoice = true; throw e; }

}

function boundaryFind(str, w){
  if (!w) return -1; const isA = c => /[a-z0-9]/.test(c); let i = str.indexOf(w);
  while (i >= 0) {
    const a = str[i-1], b = str[i + w.length];
    const badL = isA(w[0]) && a && isA(a), badR = isA(w[w.length-1]) && b && isA(b);
    if (!badL && !badR) return i;
    i = str.indexOf(w, i + 1);
  }
  return -1;
}
function descForms(raw){ return { s: nfkc(raw).toLowerCase().replace(/\s+/g, ' ').trim(), ns: normDesc(raw), orig: nfkc(raw) }; }
// 英数字の語は、摘要に実際にある大文字小文字のまま取り出す（見つからなければ正規化後の語）
function recoverAscii(orig, w){ const m = new RegExp('(^|[^A-Za-z0-9])(' + w + ')(?![A-Za-z0-9])', 'i').exec(orig); return m ? m[2] : w; }

  const ns = rule.not ? d.ns.replace(new RegExp(rule.not.source, 'g'), '\u0001') : d.ns;
  if (rule.re) { const m = rule.re.exec(ns); if (m) return m[0]; }
  for (const w of (rule.ascii || [])) { if (boundaryFind(d.s, w) >= 0 || boundaryFind(d.ns, w) >= 0) return recoverAscii(d.orig || '', w); }
  return null;
}

const TENSE_RE = /以前|かつて|昔|前は|過去|ていた|ていました|ておりました|だった|でした|解約|退会|やめた|やめました|やめて|辞めた|辞めました|終了|廃止|閉鎖|休止|解除|停止|使わなくなった|利用しなくなった|なくなった|乗り換|乗換|手放|予定|検討|考え中|つもり|今後|将来|そのうち|いずれ|(?:し|使い|始め|導入し|契約し|利用し)たい|始める|始めよう/;
const BARE_ADV_RE = /^(?:以前は?|かつては?|昔は?|今後は?|将来は?|いずれは?|そのうち)$/;   // 節が時制の副詞だけ：後ろの節にかかる
const CLAUSE_PRED_RE = /(?:て|で|た|だ|る|い|す|ん|ず)$/;   // 節が述語で終わる：後ろの節の述語を借りない（語を並べただけの節は、後ろの述語がかかる）

function analyzeProfile(profile){
  const sentences = [];
  ['content','tools','place','other'].forEach(f => String(profile[f] || '').split(/[。！？!?\n\r]+/).forEach(t => {
    if (t.trim() === '') return;
    const ns = normDesc(t);
    const segs = ns.split(/[、,，]/);
    sentences.push({ field: f, s: nfkc(t).toLowerCase().replace(/\s+/g, ' ').trim(), ns, segs, clauses: segs.flatMap(splitClauses).map(c => ({ s: c, neg: NEG_RE.test(c), tense: hasTense(c) })) });

// 'match'（肯定）／'negated'（明確な否定）／'ambiguous'（二重否定・対比・本業との対比など、自動判定しない）／'ambiguous_t'（過去・解約・予定の表現があり、現在の利用か判断できない）

  if (cl.some(c => c.neg) && CONTRAST_RE.test(t)) return 'ambiguous';

function sumBiz(l){

}
// 私用語：登場するだけでは要判断にしない。副業との関連を示す肯定的な記述（副業の内容・使うものの欄、または関連表現を含む文）がある場合のみ

  if (pos.length) return { status:'positive', word:pos[0].word };

function findOriginal(r, all){
  const base = r.descNorm.replace(new RegExp(REFUND_RE.source, 'g'), '');

/* ---- 仕分け本体（理由には、実際に一致した語と照合結果だけを書く）---- */

    case 'negated': return 'プロフィールには' + q(h.prof.word) + 'を仕事で使わない旨の記述があります。';

  switch (h.prof.status) {

/* ---- CSV用の理由文：同じ行の摘要の全文は書かず、一致語・分類の根拠・プロフィールとの関連を、既存の判定結果から組み立てる（画面用の理由文とは別に生成する）---- */

function classifyOne(r, PA, all){

        ? '元の明細（' + dispDate(r.refund) + q(r.refund.desc.trim()) + fmtYen(r.refund.amountSigned) + '円・元データ' + r.refund.rowNo + '行目）に対応するとみられます。元の明細が事業か私用かを確認し、同じ区分で確定してください。'

function csvField(v){ const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }

  const altered = []; const lines = [OUT_HEADERS.map(csvField).join(',')];
  records.forEach(r => {
    lines.push([
      csvField(guardField(r.dateRaw, altered, { rowNo:r.rowNo, col:'日付' })),
      csvField(guardField(r.desc, altered, { rowNo:r.rowNo, col:'摘要' })),
      csvField(amountOutText(r, altered)),

      csvField(guardField(csvReasonOut(r), altered, { rowNo:r.rowNo, col:'理由' }))

function verifyOutput(text, records){

  const outSum = data.reduce((s, r) => s + absOf(r[2]), 0);

  classifyAll(S.records, S.profile); S.profileChanged = false;
}
function loadText(text, fileName){
  S.pending = null;   // 新しいファイルを選んだら、前の選択待ちは破棄する

  function undoGroup(){
    const b = S.lastGroupBulk, t = undoGroupBulk(S.records, b); S.lastGroupBulk = null; t.forEach(r => S.edit.delete(r.id)); fill();
    live('直前の同じ組の一括操作（' + (b ? b.value : '') + '）を取り消し、' + t.length + '件を操作前の最終区分に戻しました。未確認は' + unconfirmed() + '件です。');
  }
  const groupIds = () => dupGroups().map(g => g[0].dupGroup);
  function gotoGroup(gid, focusId){   // 組の移動：表示を切り替えるだけ（重複確認の状態・最終区分は変更しない）。未確定のチェック選択は、解除する
    S.grpSel = new Set(); S.grpOpen = true; S.dupOnly = gid; S.filter = 'dup'; sel.value = 'dup'; fill();
    const ids = groupIds(), i = ids.indexOf(gid), k = (dupMap.get(gid) || []).length;
    gnav.scrollIntoView({ block: 'start' });
    const f = document.getElementById(focusId) && !document.getElementById(focusId).disabled ? document.getElementById(focusId) : document.getElementById('grpSelect'); if (f) f.focus({ preventScroll: true });
    live('組 ' + (i + 1) + '／' + ids.length + ' を表示しました（' + k + '件）。');
  }
  function drawNav(){
    if (S.filter !== 'dup' || !dupCount()) { gnav.replaceChildren(); return; }
    const gs = dupGroups(), ids = gs.map(g => g[0].dupGroup), cur = S.dupOnly ? ids.indexOf(S.dupOnly) : -1;
    const stat = rs => '重複確認済み ' + rs.filter(r => dupStatusOf(r) !== 'unconfirmed').length + '／' + rs.length + '件　最終区分 確定 ' + rs.filter(r => r.finalCategory).length + '／' + rs.length + '件';   // 重複確認と、最終区分の確定は、別の状態
    const prev = h('button', { type: 'button', class: 'btn sub', id: 'grpPrev', disabled: cur <= 0, onclick: () => gotoGroup(ids[cur - 1], 'grpPrev') }, '◀ 前の組');
    const nxt = h('button', { type: 'button', class: 'btn sub', id: 'grpNext', disabled: cur === ids.length - 1, onclick: () => gotoGroup(ids[cur + 1], 'grpNext') }, '次の組 ▶');
    const pick = h('select', { id: 'grpSelect', 'aria-label': '組を選んで表示' }, cur < 0 ? h('option', { value: '' }, '組を選ぶ…') : null,
      gs.map((g, i) => h('option', { value: g[0].dupGroup }, '組' + (i + 1) + '／' + gs.length + '：' + g[0].dateRaw + ' ' + g[0].desc.trim() + ' ' + amountText(g[0]) + '（' + g.length + '件）')));
    pick.value = cur < 0 ? '' : String(S.dupOnly);
    pick.addEventListener('change', () => { if (pick.value) gotoGroup(+pick.value, 'grpSelect'); });
    const all = h('button', { type: 'button', class: 'btn sub', id: 'grpAll', disabled: cur < 0, onclick: () => { S.grpSel = new Set(); showDup(); } }, 'すべての重複明細を表示');
    const back = h('button', { type: 'button', class: 'btn sub', id: 'grpBack', onclick: () => { S.dupOnly = null; S.grpSel = new Set(); sel.value = 'un'; fill(); document.querySelector('.bar').scrollIntoView({ block: 'start' }); live('未確認の明細を表示しました。'); } }, '未確認の明細に戻る');
    const g = cur >= 0 ? gs[cur] : null;
    gnav.replaceChildren(h('div', { class: 'gnav-row' }, prev, pick, nxt, all, back),
      h('p', { class: 'gnav-info', id: 'grpInfo' }, g ? ('組 ' + (cur + 1) + '／' + gs.length + '：' + g[0].dateRaw + '　' + g[0].desc.trim() + '　' + amountText(g[0]) + '（組内 ' + g.length + '件）｜' + stat(g)) : ('すべての重複明細：' + dupLabel() + '｜' + stat(gs.flat()))));
  }
  function drawGroup(){
    if (!(S.filter === 'dup' && S.dupOnly)) { gbox.replaceChildren(); return; }
    const gid = S.dupOnly, rs = S.records.filter(x => x.dupGroup === gid); S.grpSel = new Set([...S.grpSel].filter(id => rs.some(x => x.id === id)));
    const btns = [], upd = () => { btns.forEach(([b, v]) => { b.disabled = S.grpSel.size === 0; b.textContent = '選択した' + S.grpSel.size + '件を「' + v + '」にする…'; }); cnt.textContent = '選択中：' + S.grpSel.size + '件 / この組 ' + rs.length + '件'; };
    const cnt = h('p', { class: 'note', role: 'status' });
    const rowsEl = rs.map(r => h('div', { class: 'grp-row' },
      h('label', { class: 'chkrow', for: 'grp_' + r.id }, h('input', { type: 'checkbox', id: 'grp_' + r.id, checked: S.grpSel.has(r.id), onchange: e => { e.target.checked ? S.grpSel.add(r.id) : S.grpSel.delete(r.id); upd(); } }),
        '元データ' + r.rowNo + '行目　' + r.desc.trim() + '　' + amountText(r)),
      h('div', { class: 'grp-meta' }, badge(r.toolCategory), h('span', null, '重複確認：' + DUP_LABEL[dupStatusOf(r)]), h('span', null, '現在の最終区分：'), finBadge(r)),
      h('div', { class: 'bs' }, summaryOf(r)), h('details', { class: 'det' }, h('summary', null, '理由の全文'), h('p', { class: 'full' }, r.reason)),
      r.toolCategory === CAT.CHK ? h('p', { class: 'note' }, 'ツール仕分けは「要判断」です。理由を確認したうえで、変更する場合だけ、この明細を個別に選択してください。') : null));
    const mkBtn = v => { const b = h('button', { type: 'button', class: 'btn sub', onclick: () => openGroupDialog(gid, v) }, ''); btns.push([b, v]); return b; };
    const selAll = h('button', { type: 'button', class: 'btn sub', onclick: () => { rs.forEach(r => { if (r.toolCategory !== CAT.CHK) S.grpSel.add(r.id); }); drawGroup(); live('要判断を除く' + S.grpSel.size + '件を選択しました。'); } }, '要判断を除く全件を選択');
    const selNone = h('button', { type: 'button', class: 'btn sub', onclick: () => { S.grpSel = new Set(); drawGroup(); live('選択を解除しました。'); } }, '選択を解除');
    const det = h('details', { class: 'fold', id: 'grpPanel', open: S.grpOpen },
      h('summary', null, 'この組（' + rs.length + '件）の最終区分をまとめて変更（任意）'),
      h('p', { class: 'note' }, '選択した明細だけを変更します。重複確認の状態、選択していない明細、別の組の明細は変わりません。確定済みの明細も、選択すれば変更できます。要判断の明細は、「全件を選択」に含まれません。理由を確認して、個別に選択してください。初期状態では、すべて未選択です。'),
      h('div', { class: 'row' }, selAll, selNone), cnt, h('div', { class: 'grp-list' }, rowsEl), h('div', { class: 'row' }, mkBtn('事業'), mkBtn('私用')));
    det.addEventListener('toggle', () => { S.grpOpen = det.open; });
    gbox.replaceChildren(det); upd();
  }
  function openGroupDialog(gid, val){
    const ids = [...S.grpSel]; if (!ids.length) return; const rs = ids.map(id => S.records[id - 1]);
    const dlg = h('dialog', { class: 'bulk-dlg', 'aria-labelledby': 'grpTitle' });
    const chk = h('input', { type: 'checkbox', id: 'grpChk' }), cancel = h('button', { type: 'button', class: 'btn sub', id: 'grpCancel' }, 'キャンセル');
    const ok = h('button', { type: 'button', class: 'btn', id: 'grpOk', disabled: true }, '確認した' + rs.length + '件を' + val + 'に確定');
    const same = rs.filter(r => r.finalCategory === val).length;
    chk.addEventListener('change', () => { ok.disabled = !chk.checked; });
    cancel.addEventListener('click', () => dlg.close());
    ok.addEventListener('click', () => {
      if (!chk.checked) return;
      const seq = ++S.opSeq, res = applyGroupBulk(S.records, ids, gid, val, seq);
      if (res.error) return;
      S.lastGroupBulk = { ids: res.ids, value: val, seq, prev: res.prev }; S.grpSel = new Set(); res.ids.forEach(id => S.edit.delete(id)); fill();
      live('この組の' + res.count + '件を「' + val + '」で確定しました。重複確認の状態は変更していません。未確認は残り' + unconfirmed() + '件です。直前の一括操作は取り消せます。'); dlg.close();
    });
    dlg.addEventListener('close', () => { dlg.remove(); const p = document.querySelector('#grpPanel summary'); if (p) p.focus(); });
    dlg.append(h('h3', { id: 'grpTitle' }, '選択した' + rs.length + '件の最終区分を「' + val + '」にします'),
      h('p', { class: 'note' }, '選択していない明細、重複確認の状態、別の組の明細は変更しません。この画面を開いただけでは、最終区分は変更されません。' + (same ? '（すでに「' + val + '」の明細が' + same + '件含まれます。それらは変わりません）' : '')),
      h('div', { class: 'bulk-list', tabindex: '0', role: 'region', 'aria-label': '変更内容の一覧（スクロールできます）' }, rs.map(r => h('div', { class: 'bulk-row' },
        h('div', { class: 'bt' }, '元データ' + r.rowNo + '行目　' + r.desc.trim() + '　' + amountText(r)),
        h('div', { class: 'bs' }, 'ツール仕分け：' + r.toolCategory + '／重複確認：' + DUP_LABEL[dupStatusOf(r)]),
        h('div', { class: 'bs' }, '最終区分：' + (r.finalCategory || '未確認') + ' → ' + val + (r.finalCategory === val ? '（変更なし）' : '')),
        r.toolCategory === CAT.CHK ? h('p', { class: 'full' }, '【要判断】' + r.reason) : null))),
      h('label', { class: 'chkrow', for: 'grpChk' }, chk, '上記の変更内容を確認しました'), h('div', { class: 'row' }, cancel, ok));
    document.body.append(dlg); dlg.showModal(); cancel.focus();
  }
  function undoLast(){
    const v = S.lastBulk ? S.lastBulk.value : ''; const t = undoBulk(S.records, S.lastBulk); S.lastBulk = null; t.forEach(r => S.edit.delete(r.id));
    fill(); const s = bulkBox && bulkBox.querySelector('summary'); if (s) s.focus();
    live('直前のまとめて確定（' + v + '）を取り消し、' + t.length + '件を未確認に戻しました。未確認は' + unconfirmed() + '件です。');
  }
  function openEdit(r){ S.edit.add(r.id); S.lastId = r.id; swap(r, '.choice button[aria-pressed="true"]'); }
  function closeEdit(r){ S.edit.delete(r.id); swap(r, '.chg'); }
  function fill(){
    S.filter = sel.value; S.keep = new Set();   // 絞り込み操作のたびに、最新の状態で一覧を作る
    const f = S.records.filter(visible); if (S.filter === 'dup') f.sort((a, b) => a.dupGroup - b.dupGroup || a.rowNo - b.rowNo);   // 同じ組の明細を続けて表示する
    list.replaceChildren(...f.map(row), f.length ? '' : emptyNote()); refreshBar();
  }
  sel.addEventListener('change', () => { S.dupOnly = null; S.grpSel = new Set(); fill(); });
  function goNext(){   // 次の未確認カードへ移動するだけ。自動確定はしない
    const rest = S.records.filter(r => !r.finalCategory); if (!rest.length) return;
    const a = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-id]') : null;
    const cur = a && list.contains(a) ? +a.dataset.id : S.lastId;
    const idx = S.records.findIndex(r => r.id === cur) + 1;
    const seq = S.records.slice(idx).concat(S.records.slice(0, idx)).filter(r => !r.finalCategory);
    let target = seq.find(visible), msg = '';
    if (!target) { target = seq[0]; if (S.filter !== 'all') { sel.value = 'all'; fill(); msg = '絞り込みを解除して移動しました。'; } }
    S.lastId = target.id; const el = card(target.id);
    if (el) { el.scrollIntoView({ block: 'center' }); const f = el.querySelector('.choice button'); if (f) f.focus(); }
    live(msg + '次の未確認：' + target.desc.trim() + '。未確認は残り' + unconfirmed() + '件です。');
  }
  next.addEventListener('click', goNext);
  fill();
  return h('div', null, h('div', { class: 'card' }, h('h2', null, '④ 明細の確認'),
    h('p', { class: 'note' }, '全明細について、理由を確認して最終区分を「事業」または「私用」から選んでください。要判断の明細も、本人が選ぶまで確定されません。確定済みの明細は「変更する」でいつでも再編集できます。'),
    reclassInfo()),
    h('div', { class: 'bar' }, un, prog, h('span', { class: 'sp' }),
      h('label', { for: 'flt', style: 'margin:0;font-weight:400' }, '絞り込み'), sel, next), gnav, bulkBox, note, gbox, list,
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', onclick: () => go(5) }, '最終確認へ進む')));
}

/* ---- 画面5 ---- */
function download(text, name){
  const blob = new Blob(['﻿', text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob); const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function screenFinal(){
  const recs = S.records, read = S.stats ? S.stats.read : 0, shown = buildResultRows('all').length;   // 絞り込みの影響を受けない
  const csv = buildCsv(recs), v = verifyOutput(csv.text, recs), un = unconfirmed();
  const countOk = read === shown && shown === v.outCount && v.headOk && v.colsOk;
  const sumOk = v.outSum === v.inSum, textOk = v.amountTextOk;
  const ready = un === 0 && recs.length > 0 && countOk && sumOk && textOk;
  const fin = c => recs.filter(r => r.finalCategory === c).length;
  const mark = ok => h('span', { class: ok ? 'ok-t' : 'ng-t' }, ok ? '　✓ 一致' : '　✗ 不一致');
  const reasons = [];
  if (un) reasons.push('未確認の明細が' + un + '件あります。');
  if (!countOk) reasons.push('件数または列構成の照合が一致していません。');
  if (!sumOk) reasons.push('金額合計の照合が一致していません。');
  if (!textOk) reasons.push('金額の表記が元データと一致していません。');
  const btn = h('button', { type: 'button', class: 'btn', disabled: !ready, 'aria-describedby': ready ? null : 'blockWhy', onclick: () => {
    const c = buildCsv(S.records); const d = new Date();
    download(c.text, 'shiwake-note_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.csv');
  } }, 'CSVを出力する');
  const diffs = recs.filter(finalDiff).length, dups = recs.filter(r => r.dupGroup).length, dupSets = dupGroups().length, dc = dupCounts(recs);
  return h('div', { class: 'card' }, h('h2', null, '⑤ 最終確認・CSV出力'),
    h('p', { class: 'note' }, '全明細の最終区分が確定し、下の照合がすべて一致すると、CSVを出力できます。'),
    h('p', { class: 'prog', id: 'progLine' }, '全 ' + recs.length + ' 件中、確認済み ' + (recs.length - un) + ' 件・未確認 ' + un + ' 件', un ? h('b', null, '　あと ' + un + ' 件の確認が必要です') : null),
    h('div', { class: 'cards' },
      h('div', { class: 'stat un' }, h('b', null, un), h('span', null, '未確認')),
      h('div', { class: 'stat biz' }, h('b', null, fin('事業')), h('span', null, '事業（確定）')),
      h('div', { class: 'stat priv' }, h('b', null, fin('私用')), h('span', null, '私用（確定）'))),
    un ? h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn sub', id: 'goUn', onclick: () => { S.filter = 'un'; go(4); focusFirstCard(); } }, '未確認の明細を画面④で表示')) : null,
    h('h3', null, '件数・金額の照合'),
    h('dl', { class: 'kv' },
      h('dt', null, '読み込み形式'), h('dd', null, formatLabel()),
      h('dt', null, '読込件数'), h('dd', null, read + '件', h('span', { class: 'ex' }, 'CSVから読み込んだ明細の行数です。')),
      h('dt', null, '画面表示件数'), h('dd', null, shown + '件', h('span', { class: 'ex' }, '画面③に表示される全明細の件数です（絞り込みの影響を受けません）。')),
      h('dt', null, '出力件数'), h('dd', null, v.outCount + '件', mark(countOk), h('span', { class: 'ex' }, '出力するCSVの明細の行数です。読込件数・画面表示件数と同じである必要があります。')),
      h('dt', null, '金額合計（符号なし・元データ→出力）'), h('dd', null, fmtYen(v.inSum) + '円 → ' + fmtYen(v.outSum) + '円', mark(sumOk), h('span', { class: 'ex' }, '入金・返金・重複の明細も含め、符号を除いて合計した、照合用の値です。重複を除いた実際の支出額や、収支ではありません。元データと出力CSVで、同じになることを確かめます。')),
      h('dt', null, '金額の表記（元データと同じ）'), h('dd', null, textOk ? '全件が元のとおり' : '一致しない行があります', mark(textOk), h('span', { class: 'ex' }, '出力CSVの金額が、元データの表記のままかを確かめます。'))),
    diffs ? h('div', { class: 'msg info' },
      h('p', null, 'ツールの仕分けと異なる最終区分が' + diffs + '件あります。あなたの判断が優先されます。確認のための情報で、エラーではありません。このまま出力できます。'),
      h('button', { type: 'button', class: 'btn sub', onclick: () => { S.filter = 'diff'; go(4); focusFirstCard(); } }, '仕分けと異なる明細を画面④で表示')) : null,
    dups ? h('div', { class: 'msg info' },
      h('p', null, '重複の可能性のある明細が' + dups + '件（' + dupSets + '組）あります。同じ日付・摘要・金額の明細です。別々の取引の可能性もあるため、削除せずすべて出力します。重複確認は任意で、確定や出力は妨げません。'),
      h('dl', { class: 'kv', id: 'dupBreak' },
        h('dt', null, '重複候補'), h('dd', null, dc.total + '件（' + dc.groups + '組）'),
        h('dt', null, '重複明細として記録'), h('dd', null, dc.duplicate + '件'),
        h('dt', null, '別々の取引として確認'), h('dd', null, dc.separate + '件'),
        h('dt', null, '重複未確認'), h('dd', null, dc.unconfirmed + '件')),
      h('p', { class: 'note' }, '重複の確認結果は、CSVの理由欄の先頭に記載されます。元の明細はすべて保持し、出力します（削除しません）。'),
      h('button', { type: 'button', class: 'btn sub', onclick: () => { S.filter = 'dup'; S.dupOnly = null; go(4); focusFirstCard(); } }, '重複の可能性のある明細を画面④で表示')) : null,
    csv.altered.length
      ? h('div', { class: 'msg warn' }, '次の' + csv.altered.length + '件は、表計算ソフトでの数式誤実行を防ぐため、出力CSVの値の先頭に「\'」を付けます（原文とは異なる出力になります。元データは変更していません）。',
          h('ul', { class: 'sm' }, csv.altered.slice(0, 20).map(a => h('li', null, '元データ' + a.rowNo + '行目・' + a.col + '：' + a.orig.slice(0, 40)))))
      : h('div', { class: 'msg ok' }, '日付・摘要・理由はすべて原文のまま出力されます（先頭が記号の値はありません）。'),
    h('div', { class: 'msg info' }, '出力列：' + OUT_HEADERS.join('／') + '（UTF-8 BOM付き）。日付・摘要・金額は、元データの表記のまま出力します。入金・返金の別は「理由」欄に記載しています。'),
    ready ? null : h('div', { class: 'msg err', role: 'status', id: 'blockWhy' }, 'CSVを出力できません：' + reasons.join('')),
    h('div', { class: 'row' }, btn, h('button', { type: 'button', class: 'btn sub', onclick: () => go(4) }, '明細の確認へ戻る')),
    h('p', { class: 'note disc-inline', id: 'disclaimerInline' }, DISCLAIMER_TEXT));
}

/* ---- 描画 ---- */
function render(){
  const screens = { 1: screenProfile, 2: screenLoad, 3: screenResult, 4: screenConfirm, 5: screenFinal };
  app.replaceChildren(stepper(), screens[S.step]());
  document.getElementById('foot').replaceChildren(h('div', { class: 'disc', id: 'disclaimer' }, DISCLAIMER_TEXT));
}
window.addEventListener('beforeunload', e => { if (hasData()) { e.preventDefault(); e.returnValue = ''; } });
render();
</script>
